name: Firmware and portable tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/run_tests.py --cxx g++
  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/run_tests.py --cxx clang++
      - run: python -m compileall -q tools tests
      # Panel needs Tk; console/build need pyserial and must not depend on Windows.
      - run: python -c "import sys; sys.path.insert(0, 'tools'); import panel, console, build; print(console.all_ports())"
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -e esp32cam
      - uses: actions/upload-artifact@v4
        with:
          name: esp32cam-firmware
          path: |
            .pio/build/esp32cam/*.bin
            .pio/build/esp32cam/firmware.elf
